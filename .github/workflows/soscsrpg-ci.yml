name: SOSCSRPG Build and Regression Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tutorial/Tutorial020

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify RPG Engine
        run: bash scripts/verify.sh

      - name: Publish Linux Application
        run: |
          dotnet publish TerminalRpg/TerminalRpg.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o artifacts/linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soscsrpg-terminal-linux-x64
          path: Tutorial/Tutorial020/artifacts/linux-x64/
